{% extends 'base.html' %}
{% block title %} Registrazione {% endblock %}

{% block content %}
<br><h2>Registrati alla tua 3D Room</h2>
<form action="{% url 'register' %}" method="post" style="color:rgb(214, 71, 0);">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">Registrati</button>
</form>

<br>

<div style="background-color: rgba(255, 255, 255, 0.35); border-radius: 25px; padding: 15px;"><h2>
Sei già registrato?<br>
<a href="{% url 'login' %}">Vai al login cliccando quì!</a>
</h2></div>

{% endblock %}
